# ---------------------------------------------------------------------------
# TripleP Tools: free browser tools that earn from ads while you do nothing.
#
# The ONLY thing you ever need to edit is the `ads:` block below (one time).
# Until an ad ID is filled in, the site runs ad-free, so nothing ever shows
# up broken.
# ---------------------------------------------------------------------------

ads:
  provider: ""          # set during one-time setup; see README.md
  adsense_client: ""    # e.g. ca-pub-1234567890123456
  aads_unit: ""         # e.g. 2400000

# ---------------------------------------------------------------------------
# Site settings (no need to touch these)
# ---------------------------------------------------------------------------
title: TripleP Tools
tagline: Free online tools that run in your browser
description: >-
  Fast, free, private online tools for developers and everyday tasks. Everything
  runs in your browser, nothing is uploaded, and no sign-up is needed.
url: https://triplepdude.github.io
github_username: triplepdude
author: TripleP Tools
lang: en

collections:
  tools:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: tools
    values:
      layout: tool

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tests
  - package.json
  - package-lock.json
  - node_modules
