# ---------------------------------------------------------------------------
# TripleP Tools: a collection of free tools that run entirely in the browser.
#
# Optional settings. Everything works with these left empty: the site simply
# runs without ads. See README.md for the one-time setup steps.
# ---------------------------------------------------------------------------

ads:
  # Google AdSense publisher ID, e.g. ca-pub-1234567890123456. Setting it adds
  # the Auto ads script to every page and publishes a matching /ads.txt.
  adsense_client: ""
  # EthicalAds publisher ID (only once the site has ~50k monthly page views).
  # Used instead of AdSense when set, because EthicalAds must be the only ad.
  ethicalads_publisher: ""

# Search engine ownership codes (the "content" value of the verification meta
# tag each service gives you). Optional, but speeds up indexing. To use,
# remove the leading "# " from these three lines and paste your codes.
# webmaster_verifications:
#   google: "paste-google-code-here"
#   bing: "paste-bing-code-here"

# Optional donation link shown in the footer (GitHub Sponsors, Ko-fi, ...).
support_url: ""

# ---------------------------------------------------------------------------
# Site settings (no need to touch these)
# ---------------------------------------------------------------------------
title: TripleP Tools
tagline: Free online tools that run in your browser
description: >-
  Fast, free, private online tools for developers and everyday tasks. Everything
  runs in your browser, nothing is uploaded, and no sign-up is needed.
url: https://triplepdude.github.io
github_username: triplepdude
author:
  name: TripleP Tools
  type: Organization
lang: en
# Open Graph locale (language_TERRITORY).
locale: en_US

collections:
  tools:
    output: true
    permalink: /:name/

# Page dates: add `last_modified_at: YYYY-MM-DD` to a page's front matter
# (tools included) when its content really changes. It becomes the page's
# <lastmod> in /sitemap.xml and its dateModified in structured data. Pages
# without it get no date at all, rather than the build time.
defaults:
  - scope:
      path: ""
    values:
      # Preview image for shared links. A page can set its own `image:`.
      image:
        path: /assets/og.png
        width: 1200
        height: 630
        alt: "TripleP Tools: free online tools that run in your browser"
  - scope:
      path: ""
      type: tools
    values:
      layout: tool

# Page metadata comes from _includes/seo.html, and /sitemap.xml is the site's
# own sitemap.xml; jekyll-sitemap now only generates /robots.txt.
plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tests
  - package.json
  - package-lock.json
  - node_modules
