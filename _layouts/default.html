<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
  {% include ad-head.html %}
</head>
<body>
  <header class="site-header">
    <nav class="nav wrap" aria-label="Main">
      <a class="brand" href="{{ '/' | relative_url }}">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.1-.5-.5-2.1z"/></svg>
        {{ site.title }}
      </a>
      <a class="nav-link" href="{{ '/' | relative_url }}#all-tools">All tools</a>
    </nav>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>Every tool runs entirely in your browser. Your data never leaves your device.</p>
      <nav class="footer-links" aria-label="Footer">
        <a href="{{ '/' | relative_url }}">All tools</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
      <p class="fine">&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
    </div>
  </footer>
</body>
</html>
