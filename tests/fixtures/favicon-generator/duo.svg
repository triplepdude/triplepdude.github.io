<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 10">
  <style>#a { fill: #ff0000 } @media (prefers-color-scheme: dark) { #a { fill: #00ff00 } }
    #b { color-scheme: light dark; fill: light-dark(#ff0000, #00ff00) }</style>
  <rect id="a" width="10" height="10"/>
  <rect id="b" x="10" width="10" height="10"/>
</svg>
